<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bjp Muzaffarpur West</title>
    <style>
        @keyframes bgChange {
            0%, 100% { background: linear-gradient(#8B4000, #FFA500, #FF5F15); }
            50% { background: linear-gradient(to bottom, #FF9933 50%, #138808 50%); }
        }
        @keyframes bloom {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.5); opacity: 0; }
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            animation: bgChange 30s infinite;
            color: white;
            padding: 10px;
        }

        .container { text-align: center; width: 100%; max-width: 800px; }
        
        .lotus {
            width: 80px; height: 80px;
            background: radial-gradient(circle, #ff007f 20%, transparent 60%);
            margin: 10px auto;
            animation: bloom 30s infinite;
        }

        .header-images {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            margin-bottom: 20px;
        }
        
        /* मोबाइल के लिए इमेजेस का साइज एडजस्टमेंट */
        .img-1 { width: 80px; height: 110px; }
        .img-2 { width: 80px; height: 100px; }
        .img-5 { width: 80px; height: 90px; }
        .img-4 { width: 80px; height: 85px; }

        .logo { width: 150px; height: auto; }
        
        .leaders-section { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .leader { text-align: center; width: 150px; }
        .leader img { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; }
        .leader p { font-size: 0.8em; font-weight: bold; margin-top: 5px; }

        h1 { font-size: 1.5em; margin: 15px 0; }
        .nav-links a { display: inline-block; color: white; text-decoration: none; margin: 5px; border: 2px solid white; padding: 5px 10px; border-radius: 5px; font-size: 0.9em; }

        /* टैबलेट और डेस्कटॉप के लिए बड़ी स्टाइल्स */
        @media (min-width: 600px) {
            .img-1 { width: 150px; height: 200px; }
            .img-2 { width: 150px; height: 180px; }
            .img-5 { width: 150px; height: 170px; }
            .img-4 { width: 150px; height: 160px; }
            .logo { width: 300px; }
            .leader { width: 250px; }
            .leader img { width: 200px; height: 200px; border-radius: 0; }
            .leader p { font-size: 1em; }
            h1 { font-size: 3em; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="lotus"></div>

        <div class="header-images">
            <div class="left-side">
                <img src="public/1.PNG" class="img-1" alt="1">
                <img src="public/2.PNG" class="img-2" alt="2">
            </div>
            <div class="right-side">
                <img src="public/4.PNG" class="img-4" alt="4">
                <img src="public/5.PNG" class="img-5" alt="5">
            </div>
        </div>

        <div class="leaders-section">
            <div class="leader">
                <img src="public/hari mohan.png" alt="हरिमोहन चौधरी">
                <p>हरिमोहन चौधरी<br>जिलाध्यक्ष<br>भाजपा मुजफ्फरपुर पश्चिमी</p>
            </div>
            <img src="public/bjp.png" alt="BJP Logo" class="logo">
            <div class="leader">
                <img src="public/00 new1- copy.PNG" alt="सम्राट कुमार गुप्ता">
                <p>सम्राट कुमार गुप्ता<br>जिला महामंत्री सह मुख्यालय प्रभारी<br>भाजपा मुजफ्फरपुर पश्चिमी</p>
            </div>
        </div>

        <h1>भारतीय जनता पार्टी मुजफ्फरपुर पश्चिमी में आपका स्वागत है</h1>
        <p>यह भारतीय जनता पार्टी, मुजफ्फरपुर पश्चिमी जिला का आधिकारिक पेज है|</p>

        <div class="nav-links">
            <a href="pages/_index.js">Home</a>
            <a href="pages/_app.js">Main</a>
            <a href="components/_contact.html">संपर्क</a>
        </div>
    </div>
</body>
</html>
